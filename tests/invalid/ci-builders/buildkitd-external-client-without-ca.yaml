# refuses: externalClients needs clientCA.create: true
buildkitd:
  mtls:
    enabled: true
    clientCA:
      requesterNamespaces: [arc-runners-example]
      create: false
      externalClients:
        outside: {commonName: ci-runner-outside}
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
