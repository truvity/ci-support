# Source: ci-builders/templates/external-builders.yaml
# The client CA certificate, the one authority the builders accept client
# certificates from: ca.crt of buildkit-client-outside-tls, alone.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: buildkitd-external-client-ca
  labels:
    app.kubernetes.io/name: buildkitd-external
    app.kubernetes.io/part-of: ci-builders
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: example-server-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: buildkit-client-outside-tls
  data:
    - conversionStrategy: None
      match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: "client-ca"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          description: BuildKit builders' client CA certificate, pushed by External Secrets
          kmsKeyID: alias/example-server
          secretType: SecureString
          tags:
            component: ci
