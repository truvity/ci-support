---
# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-builders
    spec:
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: docker.io/buchgr/bazel-remote-cache:v2.6.2
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size=8
            - --port=8080
            - --grpc_port=9092
            # TLS on both ports (bazelRemote.tls), loaded once at start.
            - --tls_cert_file=/etc/bazel-remote/tls/tls.crt
            - --tls_key_file=/etc/bazel-remote/tls/tls.key
            - --min_tls_version=1.3
            # Client certificates are verified against this CA; a write needs
            # one, a read none.
            - --tls_ca_file=/etc/bazel-remote/client-ca/ca.crt
            - --allow_unauthenticated_reads
          ports:
            - name: https
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/bazel-remote/tls
              readOnly: true
            - name: client-ca
              mountPath: /etc/bazel-remote/client-ca
              readOnly: true
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data
        - name: tls
          secret:
            secretName: bazel-remote-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: client-ca
          configMap:
            name: buildkitd-client-ca
            items:
              - key: ca.crt
                path: ca.crt

---
# Source: ci-builders/templates/npm-cache.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # verdaccio uid in the official image
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: docker.io/verdaccio/verdaccio:6.10.4
          # No args: the image's entrypoint is `dumb-init --` with
          # `verdaccio --config /verdaccio/conf/config.yaml` as CMD —
          # args REPLACE the CMD, so passing flags alone makes
          # dumb-init exec "--config" and crashloop. The mount below
          # lands on the image's default config path.
          ports:
            - name: http
              containerPort: 4873
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: npm-cache-config-v1
        - name: data
          persistentVolumeClaim:
            claimName: npm-cache-data

---
# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
spec:
  schedule: "5 4 * * 3"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bazel-remote-restart
            app.kubernetes.io/part-of: ci-builders
        spec:
          serviceAccountName: bazel-remote-restart
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              # Digest-pinned (restart.image.digest): the tag is not used.
              image: registry.example/registry.k8s.io/kubectl@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
              imagePullPolicy: IfNotPresent
              args: ["rollout", "restart", "deployment/bazel-remote"]
              env:
                # kubectl keeps a discovery cache under $HOME.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}

---
# Source: ci-builders/templates/bazel-remote.yaml
# bazel-remote's own server certificate (bazelRemote.tls): the TLS is
# bazel-remote's, so a gateway in front passes it through by SNI rather than
# terminating it, and a client certificate reaches bazel-remote.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  secretName: bazel-remote-tls
  commonName: "bazel.cache.example.private"
  dnsNames:
    - bazel.cache.example.private
    - bazel-remote.example.svc
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-private
