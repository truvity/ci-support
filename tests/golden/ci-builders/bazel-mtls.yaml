# Source: ci-builders/templates/npm-cache.yaml
# Only the listed consumer namespaces may reach the cache.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: npm-cache-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners-example
      ports:
        - port: 4873
          protocol: TCP

---
# Source: ci-builders/templates/bazel-remote.yaml
# bazel-remote reads its certificate once, at start: this restarts it on a
# schedule well inside the certificate's renewBefore, so a renewal is loaded
# before the old certificate expires (bazelRemote.tls.restart).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
automountServiceAccountToken: false

---
# Source: ci-builders/templates/npm-cache.yaml
# npm-cache (verdaccio): read-through proxy of registry.npmjs.org.
# Metadata is short-TTL'd, tarballs cached forever on a disposable PVC
# — a CACHE by doctrine: no backups, losing it costs a re-warm.
# Public packages only: publish denied, registration off, no uplink
# credentials. Consumers reach it as an ordinary registry
# (npmRegistryServer: http://npm-cache.<ns>.svc) behind a health-probe
# fallback to upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  # Version suffix: bump on ANY config edit — the Deployment references
  # the versioned name, so the bump is what rolls the pod.
  name: npm-cache-config-v1
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-builders
data:
  config.yaml: |
    storage: /verdaccio/storage
    # Registration disabled; nothing authenticates, nothing publishes.
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true
    packages:
      '**':
        access: $all
        proxy: npmjs
        # no publish/unpublish rule -> denied for everyone
    server:
      keepAliveTimeout: 60
    web:
      enable: true
      title: ci npm cache
    log:
      type: stdout
      format: pretty
      level: warn
    listen: 0.0.0.0:4873

---
# Source: ci-builders/templates/bazel-remote.yaml
# bazel-remote: a Bazel Remote Execution v2 API cache (moon's remote
# task cache speaks it; moon has no native S3). Disk-backed by default:
# zero IAM, cluster-local latency. bazelRemote.s3.enabled switches on
# bazel-remote's S3 PROXY backend, which sits in FRONT of the same
# local --dir disk rather than replacing it -- the PVC below stays the
# working set either way. It is a CACHE either way: losing it costs one
# cold rebuild (or, with S3, however much the disk hasn't re-warmed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazel-remote-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi

---
# Source: ci-builders/templates/npm-cache.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm-cache-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

---
# Source: ci-builders/templates/bazel-remote.yaml
# Get and patch this one Deployment: what `kubectl rollout restart` needs.
# Patch on a Deployment is as strong as creating a pod in this namespace (the
# pod template can be rewritten to mount any Secret here or run as any
# ServiceAccount), so the token is this dedicated ServiceAccount's, mounted
# only in the CronJob's pod. Deleting the pod instead would need list and
# delete on every pod here (pod names are random) and lose Recreate's order.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["bazel-remote"]
    verbs: ["get", "patch"]

---
# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bazel-remote-restart
subjects:
  - kind: ServiceAccount
    name: bazel-remote-restart
    namespace: example

---
# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: v1
kind: Service
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  selector:
    app.kubernetes.io/name: bazel-remote
  ports:
    - name: https
      port: 8080
      targetPort: https
    # TLS, bazel-remote's own (bazelRemote.tls): a gateway passes it through
    # by SNI (a TLSRoute to this port), so no appProtocol; an HTTPRoute that
    # spoke h2c here no longer can.
    - name: grpc
      port: 9092
      targetPort: grpc

