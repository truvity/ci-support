# Who may write the Gradle build cache (v1.2.0): cache-redirect takes its
# writers' tokens from a Secret of the release namespace; reads need none.
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nodeClasses:
  cache-plane: {}
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  gradle:
    writeAuth:
      existingSecret: ci-cache-writers
      key: gradle-tokens
