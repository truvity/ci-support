# One external client identity (a runner that lives outside the cluster): its
# own Certificate and policy, and a PushSecret to a secret store the estate owns.
buildkitd:
  mtls:
    enabled: true
    clientCA:
      create: true
      requesterNamespaces: [arc-runners-example]
      externalClients:
        outside:
          commonName: ci-runner-outside
          push:
            enabled: true
            storeRef:
              name: example-push
            refreshInterval: 30m
            kmsKeyId: alias/example-client
            tags:
              component: ci
            caPem: |
              -----BEGIN CERTIFICATE-----
              MIIBexample
              -----END CERTIFICATE-----
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
