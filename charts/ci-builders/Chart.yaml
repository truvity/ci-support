apiVersion: v2
name: ci-builders
description: >-
  The CI cache plane (cache-redirect, bazel-remote, the npm cache) and the
  TLS trust of the BuildKit builders that run outside the cluster (the
  client CA, the Fargate runners' client certificate, the builders' server
  certificates pushed to a store). Every component is DISPOSABLE -- no
  backups; losing one costs a re-warm.
type: application
