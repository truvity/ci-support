# Preset: the STABLE tier's cache plane. Opt in by listing it
# before your own values (Argo CD: `helm.valueFiles:
# [presets/stable.yaml]`). A later values file wins key by key.
#
# Shape: pull-through caches, the Gradle build cache of cache-redirect (see
# below), no bazel-remote and no npm cache. The preset names no
# node pool, label or taint of a platform; it refers to NAMES that you
# define in your own values:
#
#   nodeClasses.cache-plane        where the caches go (`{}` for nowhere
#                                  in particular)
#
# The chart refuses to render with a name undefined. A platform's own pod
# annotations and storage class are not here: see presets/karpenter.yaml.
# Estate facts are never in a preset.
nodeClass: cache-plane
bazelRemote:
  enabled: false
npmCache:
  enabled: false
cacheRedirect:
  # The Gradle remote build cache is ON on the stable tier too (v7.7.0). It is
  # writable by whoever can reach the service, so what keeps a stable runner
  # from reading what a preview job wrote is that the tiers are separate
  # deployments: the stable cache-redirect has its own bucket, its network
  # policy admits only stable runners, and only stable jobs write to it.
  gradle:
    enabled: true
  # The npm registry (v7.8.0) is ON on the stable tier too: it is read-only for
  # clients (publish, unpublish and login are refused, no credential goes
  # upstream), and the packuments and tarballs it keeps are the registry's own
  # public documents. It replaces `npmCache` (verdaccio, which stays off here:
  # a second stateful service the stable tier never had).
  npm:
    enabled: true
