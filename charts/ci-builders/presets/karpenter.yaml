# Preset (opt-in): the Karpenter and EKS assumptions. List it, with a tier
# preset or alone, ONLY where Karpenter (or EKS Auto Mode, which runs it)
# provisions the nodes of an EKS cluster. Nothing else in this chart
# assumes either. The pool labels and taints are not here: they are your
# `nodeClasses`.
#
# storageClassName: EKS's gp3 EBS class, for the caches' volumes.
# Elsewhere the cluster's default StorageClass (or the one you name) does.
storageClassName: gp3
