{{- /*
Keys this chart no longer honours.

A chart that quietly ignores a value the caller still sets is the worst
shape an upgrade can take: helm reports success, argo reports Synced,
and the feature the caller asked for is simply gone. Renaming the chart
makes that failure MORE likely, not less, because a caller porting
their values from `ci-cache` to `ci-builders` is already editing this
file and will carry the old block across.

So each removed key fails the render and says where the feature went.
The check is hasKey, not truthiness: `nixWorkers: {enabled: false}` is
still a caller who believes the feature exists.
*/ -}}
{{- if hasKey .Values "nixWorkers" }}
{{- fail "ci-support v1.0.0 removed `nixWorkers`: the persistent Nix remote workers (StatefulSets, SSH and opkssh logins, host certificates, their NetworkPolicy and ServiceAccount) are gone. Delete the `nixWorkers` block (and presets/nix-workers.yaml from your valueFiles); builds that need Nix fetch through the cache-redirect `/nix` front-end (`cacheRedirect.nix`)." }}
{{- end }}
{{- if hasKey .Values "nixWorkerImage" }}
{{- fail "ci-support v1.0.0 removed `nixWorkerImage`: there is no Nix worker to run it. Delete the `nixWorkerImage` block from your values." }}
{{- end }}
{{- if hasKey .Values "runnerImage" }}
{{- fail "ci-support v1.0.0 removed `runnerImage`: only the Nix workers ran it. Delete the `runnerImage` block from your values." }}
{{- end }}
{{- if hasKey .Values "sizes" }}
{{- fail "ci-support v1.0.0 removed `sizes`: it sized the in-cluster buildkitd and the Nix workers, both gone. Delete the `sizes` key from your values." }}
{{- end }}
{{- $bk := .Values.buildkitd | default dict }}
{{- range $k := keys $bk | sortAlpha }}
{{- if not (has $k (list "enabled" "mtls")) }}
{{- fail (printf "ci-support v1.0.0 removed the in-cluster BuildKit builders, and with them `buildkitd.%s`: the builders are pkg/buildkit/ec2's, outside the cluster. Only `buildkitd.enabled` and `buildkitd.mtls` (the client CA and its client identities) remain; delete the other keys of `buildkitd` from your values." $k) }}
{{- end }}
{{- end }}
{{- range $k := keys ($bk.mtls | default dict) | sortAlpha }}
{{- if not (has $k (list "enabled" "clientCA")) }}
{{- fail (printf "ci-support v1.0.0 removed the in-cluster BuildKit builders, and with them `buildkitd.mtls.%s` (modes parallel and inPlace, retirePlain, the in-cluster server certificates, their NetworkPolicy). Only `buildkitd.mtls.enabled` and `buildkitd.mtls.clientCA` remain; the builders' own server certificates are `externalBuilders.serverCertificate`." $k) }}
{{- end }}
{{- end }}
{{- if hasKey .Values "nixCache" }}
{{- fail "ci-builders 7.0.0 removed `nixCache`: the nginx read-through cache of the Nix binary cache is gone. Its replacement is the cache-redirect `/nix` front-end (`cacheRedirect.enabled: true`, `cacheRedirect.nix`); point the runners at it with arc-runners' `nixCache.url: http://cache-redirect.<namespace>.svc.cluster.local/nix`. Delete the `nixCache` block from your values (and the `nix-cache-data` PVC it left behind)." }}
{{- end }}
{{- if hasKey .Values "goModproxy" }}
{{- fail "ci-builders 7.0.0 removed `goModproxy`: the Go module proxy component is gone. Its replacement is the cache-redirect `/goproxy` front-end (`cacheRedirect.enabled: true`, `cacheRedirect.goproxy`); set GOPROXY=http://cache-redirect.<namespace>.svc.cluster.local/goproxy|https://proxy.golang.org,direct. Delete the `goModproxy` block from your values." }}
{{- end }}
