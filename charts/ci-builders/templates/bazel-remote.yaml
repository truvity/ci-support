{{- if .Values.bazelRemote.enabled }}
{{- $z := .Values.bazelRemote }}
{{- if and $z.serviceAccount.create (not $z.serviceAccountName) }}{{ fail "bazelRemote.serviceAccountName is required when bazelRemote.serviceAccount.create is true" }}{{ end }}
{{- $tls := $z.tls | default dict }}
{{- $ca := $tls.clientCA | default dict }}
{{- if $tls.enabled }}
{{- if not (dig "serverCertificate" "issuerRef" "name" "" $tls) }}{{ fail "bazelRemote.tls.serverCertificate.issuerRef.name is required while bazelRemote.tls.enabled is true: the issuer of bazel-remote's server certificate, one the clients trust" }}{{ end }}
{{- if not (dig "serverCertificate" "dnsNames" (list) $tls) }}{{ fail "bazelRemote.tls.serverCertificate.dnsNames is required and non-empty while bazelRemote.tls.enabled is true: the names clients dial" }}{{ end }}
{{- if and $tls.restart.enabled (not $tls.restart.schedule) }}{{ fail "bazelRemote.tls.restart.schedule is required while bazelRemote.tls.restart.enabled is true" }}{{ end }}
{{- if and $ca.configMapName (not $ca.key) }}{{ fail "bazelRemote.tls.clientCA.key is required with bazelRemote.tls.clientCA.configMapName" }}{{ end }}
{{- else if $ca.configMapName }}{{ fail "bazelRemote.tls.clientCA.configMapName needs bazelRemote.tls.enabled: the client CA is verified in bazel-remote's own TLS handshake" }}{{ end }}
{{- if $z.s3.enabled }}
{{- if not $z.s3.bucket }}{{ fail "bazelRemote.s3.bucket is required when bazelRemote.s3.enabled is true" }}{{ end }}
{{- if not $z.s3.region }}{{ fail "bazelRemote.s3.region is required when bazelRemote.s3.enabled is true" }}{{ end }}
{{- end }}
{{- if $z.serviceAccount.create }}
---
# The ServiceAccount the estate's Pod Identity association names
# (bazelRemote.serviceAccountName): the association is made against an
# object that exists, and the pod is not admitted without it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $z.serviceAccountName }}
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
  {{- with $z.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if $tls.enabled }}
{{- $cert := $tls.serverCertificate }}
---
# bazel-remote's own server certificate (bazelRemote.tls): the TLS is
# bazel-remote's, so a gateway in front passes it through by SNI rather than
# terminating it, and a client certificate reaches bazel-remote.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  secretName: bazel-remote-tls
  commonName: {{ first $cert.dnsNames | quote }}
  dnsNames:
    {{- toYaml $cert.dnsNames | nindent 4 }}
  {{- /* No usages: an issuer whose
         approver policy lists none denies a request that names any. */}}
  duration: {{ $cert.duration }}
  renewBefore: {{ $cert.renewBefore }}
  privateKey:
    {{- toYaml $cert.privateKey | nindent 4 }}
    rotationPolicy: Always
  issuerRef:
    {{- toYaml $cert.issuerRef | nindent 4 }}
{{- end }}
---
# bazel-remote: a Bazel Remote Execution v2 API cache (moon's remote
# task cache speaks it; moon has no native S3). Disk-backed by default:
# zero IAM, cluster-local latency. bazelRemote.s3.enabled switches on
# bazel-remote's S3 PROXY backend, which sits in FRONT of the same
# local --dir disk rather than replacing it -- the PVC below stays the
# working set either way. It is a CACHE either way: losing it costs one
# cold rebuild (or, with S3, however much the disk hasn't re-warmed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazel-remote-data
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $z.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-builders
    spec:
      {{- with $z.serviceAccountName }}
      # EKS Pod Identity binds an IAM role to a namespace + ServiceAccount
      # pair. This must be the exact ServiceAccount the estate's Pod
      # Identity association names, or the mismatch is SILENT: the pod
      # starts, answers every read/write request, and the S3 backend
      # simply has no credentials, so nothing lands in the bucket and
      # nothing looks broken until someone measures the hit rate.
      serviceAccountName: {{ . }}
      {{- end }}
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      {{- $placement := include "ci-builders.placement" (dict "root" $) | fromJson }}
      {{- with $placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: {{ include "ci-builders.image" $z.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size={{ $z.maxSizeGb }}
            - --port=8080
            - --grpc_port=9092
            {{- if $tls.enabled }}
            # TLS on both ports (bazelRemote.tls), loaded once at start.
            - --tls_cert_file=/etc/bazel-remote/tls/tls.crt
            - --tls_key_file=/etc/bazel-remote/tls/tls.key
            - --min_tls_version={{ $tls.minVersion }}
            {{- if $ca.configMapName }}
            # Client certificates are verified against this CA; a write needs
            # one{{ if $ca.allowUnauthenticatedReads }}, a read none{{ else }}, and so does a read{{ end }}.
            - --tls_ca_file=/etc/bazel-remote/client-ca/ca.crt
            {{- if $ca.allowUnauthenticatedReads }}
            - --allow_unauthenticated_reads
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $z.s3.enabled }}
            # S3 is a PROXY backend in front of --dir above (upstream
            # bazel-remote docs): the PVC stays the working set and
            # every read/write still goes through it first. auth_method
            # iam_role with no --s3.iam_role_endpoint makes the minio
            # client look for credentials in "the standard locations for
            # the AWS platform" -- which is where EKS Pod Identity
            # injects them (AWS_CONTAINER_CREDENTIALS_*), so no key
            # material belongs in this chart.
            - --s3.bucket={{ $z.s3.bucket }}
            - --s3.region={{ $z.s3.region }}
            # bazel-remote refuses to start without an endpoint (minio:
            # "Endpoint: does not follow ip address or domain name
            # standards"); the regional AWS one, since this backend is AWS only.
            - --s3.endpoint=s3.{{ $z.s3.region }}.amazonaws.com
            - --s3.auth_method=iam_role
            {{- with $z.s3.prefix }}
            - --s3.prefix={{ . }}
            {{- end }}
            {{- end }}
          ports:
            - name: {{ if $tls.enabled }}https{{ else }}http{{ end }}
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if $tls.enabled }}
            - name: tls
              mountPath: /etc/bazel-remote/tls
              readOnly: true
            {{- if $ca.configMapName }}
            - name: client-ca
              mountPath: /etc/bazel-remote/client-ca
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml $z.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data
        {{- if $tls.enabled }}
        - name: tls
          secret:
            secretName: bazel-remote-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- if $ca.configMapName }}
        - name: client-ca
          configMap:
            name: {{ $ca.configMapName }}
            items:
              - key: {{ $ca.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  selector:
    app.kubernetes.io/name: bazel-remote
  ports:
    {{- if $tls.enabled }}
    - name: https
      port: 8080
      targetPort: https
    # TLS, bazel-remote's own (bazelRemote.tls): a gateway passes it through
    # by SNI (a TLSRoute to this port), so no appProtocol; an HTTPRoute that
    # spoke h2c here no longer can.
    - name: grpc
      port: 9092
      targetPort: grpc
    {{- else }}
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9092
      targetPort: grpc
      # The gRPC port speaks HTTP/2 without TLS. Declared so a gateway that
      # reaches it over an HTTPRoute (Envoy Gateway reads this field) talks
      # HTTP/2 to the pod rather than HTTP/1.1; kube-proxy and in-cluster
      # clients ignore it.
      appProtocol: kubernetes.io/h2c
    {{- end }}
{{- if and $tls.enabled $tls.restart.enabled }}
{{- $r := $tls.restart }}
---
# bazel-remote reads its certificate once, at start: this restarts it on a
# schedule well inside the certificate's renewBefore, so a renewal is loaded
# before the old certificate expires (bazelRemote.tls.restart).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
automountServiceAccountToken: false
---
# Get and patch this one Deployment: what `kubectl rollout restart` needs.
# Patch on a Deployment is as strong as creating a pod in this namespace (the
# pod template can be rewritten to mount any Secret here or run as any
# ServiceAccount), so the token is this dedicated ServiceAccount's, mounted
# only in the CronJob's pod. Deleting the pod instead would need list and
# delete on every pod here (pod names are random) and lose Recreate's order.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["bazel-remote"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bazel-remote-restart
subjects:
  - kind: ServiceAccount
    name: bazel-remote-restart
    namespace: {{ $.Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bazel-remote-restart
  labels:
    app.kubernetes.io/name: bazel-remote-restart
    app.kubernetes.io/part-of: ci-builders
spec:
  schedule: {{ $r.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bazel-remote-restart
            app.kubernetes.io/part-of: ci-builders
        spec:
          serviceAccountName: bazel-remote-restart
          automountServiceAccountToken: true
          restartPolicy: Never
          {{- with $placement.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $placement.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              {{- if $r.image.digest }}
              # Digest-pinned (restart.image.digest): the tag is not used.
              image: {{ with $r.image.registry }}{{ . }}/{{ end }}{{ $r.image.repository }}@{{ $r.image.digest }}
              {{- else }}
              image: {{ include "ci-builders.image" $r.image }}
              {{- end }}
              imagePullPolicy: IfNotPresent
              args: ["rollout", "restart", "deployment/bazel-remote"]
              env:
                # kubectl keeps a discovery cache under $HOME.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml $r.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
{{- end }}
