{{- /*
The client CA of the mutual-TLS BuildKit builders. The in-cluster builders
this file used to render (StatefulSets, Services, server Certificates,
NetworkPolicies, modes parallel and inPlace) were removed in v1.0.0: the
builders are pkg/buildkit/ec2's, outside the cluster.

What is left is the trust: the ONE client CA that the builders accept client
certificates from. A builder accepts a client only when its certificate
chains to it (--tlscacert: the daemon then requires and verifies a client
certificate). With buildkitd.mtls.clientCA.create the chart builds the CA
(see the values); the client identities that chain to it are
buildkitd-external-clients.yaml's, and the builders' own server certificates
are external-builders.yaml's.
*/ -}}
{{- if and .Values.buildkitd.enabled .Values.buildkitd.mtls.enabled }}
{{- $ca := .Values.buildkitd.mtls.clientCA }}
{{- if not $ca.configMapName }}{{ fail "buildkitd.mtls.clientCA.configMapName is required: the client CA certificate (ca.crt) is published to it" }}{{ end }}
{{- if $ca.create }}
{{- if not $ca.requesterNamespaces }}{{ fail "buildkitd.mtls.clientCA.requesterNamespaces is required and non-empty while clientCA.create is true: the policy admits requests from those namespaces and no others" }}{{ end }}
{{- end }}
{{- if $ca.create }}
{{- $issuer := $ca.issuerName }}
---
# The root of the client trust: a self-signed issuer whose only job is to
# sign the CA below. Namespaced, so the allow-all policy for namespaced
# Issuers admits its requests.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $issuer }}-selfsigned
  namespace: {{ $ca.namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $issuer }}-ca
  namespace: {{ $ca.namespace }}
spec:
  isCA: true
  commonName: {{ $issuer }} client CA
  secretName: {{ $issuer }}-ca
  duration: {{ $ca.duration }}
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Never
  issuerRef:
    name: {{ $issuer }}-selfsigned
    kind: Issuer
    group: cert-manager.io
---
# Cluster-scoped, so a runner namespace can neither read the CA key (it is
# in {{ $ca.namespace }}) nor sign with it: it can only ask, and the policy
# below decides.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer }}
spec:
  ca:
    secretName: {{ $issuer }}-ca
{{- if $ca.policy.enabled }}
---
# approver-policy: only the listed namespaces may request from this issuer,
# and only client-auth certificates carrying the one common name, ECDSA.
# Anything else is denied, including every SAN.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: {{ $issuer }}
spec:
  allowed:
    commonName:
      required: true
      value: {{ $ca.commonName | quote }}
    usages:
      - client auth
      - digital signature
      - key encipherment
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      name: {{ $issuer }}
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        {{- toYaml $ca.requesterNamespaces | nindent 8 }}
---
# approver-policy approves a request only when its requester may `use` a
# policy that admits it. The requester of a Certificate is cert-manager
# itself; bound in the requester namespaces only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $issuer }}-policy-use
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames: [{{ $issuer | quote }}]
{{- range $ns := $ca.requesterNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $issuer }}-policy-use
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $issuer }}-policy-use
subjects:
  - kind: ServiceAccount
    name: {{ $ca.requester.name }}
    namespace: {{ $ca.requester.namespace }}
{{- end }}
{{- end }}
{{- if $ca.bundle.enabled }}
---
# trust-manager copies the CA CERTIFICATE (never its key) into this
# release's namespace as the ConfigMap the builders read.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ $ca.configMapName }}
spec:
  sources:
    - secret:
        name: {{ $issuer }}-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
