# Release: a v* tag publishes this repository at ONE version: the
# cache-redirect image and every chart under charts/ (ci-builders), with
# each image's digest stamped into the chart defaults. Consumers pin one
# chart version and are transitively digest-pinned.
#
# Nothing rebuilds on a schedule and nothing publishes from a PR or a
# master merge. Restrict tag creation by ruleset where the repository's
# settings are managed: who can tag is who can publish.
#
# THE SHAPE, and why it is two stages:
#
#   base-<arch>  image/cache-redirect/Dockerfile, built ONCE PER
#                ARCHITECTURE on a NATIVE runner (arm64 runs on
#                ubuntu-24.04-arm), so nothing is emulated.
#   release      merges the pair into a manifest list, then builds the
#                RUN-LESS image/release/cache-redirect.Dockerfile --
#                `FROM` that list plus labels, which buildx assembles per
#                platform without executing anything -- and publishes the
#                charts.
#
# The packages are nested under the repository's own name
# (ghcr.io/truvity/ci-support/...), so GHCR links them to this repository
# and the first push creates them with this workflow's GITHUB_TOKEN. The
# chart is NOT ghcr.io/truvity/charts/ci-builders: that package belongs
# to truvity/ci-plane and carries its 2.x-8.x version line.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/truvity/ci-support
  CHARTS: ghcr.io/truvity/ci-support/charts

jobs:
  base:
    name: base-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - name: Resolve version from the release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::releases build only from v* tags (got $GITHUB_REF)"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build the per-arch base
        run: |
          set -euo pipefail
          img=cache-redirect
          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --file "image/${img}/Dockerfile" \
            --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
            --cache-from "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }}" \
            --cache-to   "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }},mode=max" \
            --push \
            image/

  release:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      # One manifest list, so the release Dockerfile's plain
      # `FROM <base>:<version>` resolves per platform.
      - name: Merge the native halves
        run: |
          set -euo pipefail
          img=cache-redirect
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}" \
            "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-amd64" \
            "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-arm64"

      - name: Build and push the release image
        id: images
        run: |
          set -euo pipefail
          img=cache-redirect
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file "image/release/${img}.Dockerfile" \
            --build-arg "BASE_IMAGE=${IMAGE_REPO}/${img}-base" \
            --build-arg "BASE_TAG=${GITHUB_REF_NAME}" \
            --build-arg "VERSION=${GITHUB_REF_NAME}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE_REPO}/${img}:${GITHUB_REF_NAME}" \
            --push \
            image/
          digest=$(docker buildx imagetools inspect "${IMAGE_REPO}/${img}:${GITHUB_REF_NAME}" \
                     --format '{{json .Manifest.Digest}}' | tr -d '"')
          # Underscored: a hyphen in `steps.x.outputs.cache-redirect`
          # parses as SUBTRACTION in a GitHub expression.
          echo "cache_redirect=${digest}" >> "$GITHUB_OUTPUT"
          echo "cache-redirect image digest: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      # BY KEY, never by a blind sed over every `digest:` line.
      - name: Stamp the digests into chart defaults
        run: |
          set -euo pipefail
          ./hack/stamp-digests.sh \
            "cacheRedirectImage=${{ steps.images.outputs.cache_redirect }}"
          VERSION="${GITHUB_REF_NAME#v}"
          for c in charts/*/Chart.yaml; do
            sed -i -E "s|^version: .*$|version: ${VERSION}|; s|^appVersion: .*$|appVersion: ${VERSION}|" "$c"
          done

      - name: Login helm to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package and push charts
        run: |
          set -euo pipefail
          mkdir -p dist
          for c in charts/*; do
            # A chart does not lint bare: it refuses to guess the estate
            # facts it needs, so lint starts from the CI base values.
            helm lint "$c" -f "tests/ci/$(basename "$c").yaml"
            helm package "$c" -d dist
          done
          for pkg in dist/*.tgz; do
            helm push "$pkg" "oci://$CHARTS"
          done
          echo "charts published at ${GITHUB_REF_NAME#v} to oci://$CHARTS: $(ls dist)" >> "$GITHUB_STEP_SUMMARY"
