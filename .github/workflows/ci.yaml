# PR gate: the chart must lint and template with defaults AND with an
# estate-shaped values overlay; the cache-redirect image must build on
# both architectures, each on a native runner; its Go module must lint,
# vet and test; and the Justfile's recipes (the goldens, their schema
# check and the leak canary) run through the shared check workflow.
#
# Hosted runners: minutes are free on public repositories, and a public
# repository must not run fork code on its own infrastructure.
#
# Pinned by COMMIT SHA, never a tag: tags move.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint and template
        run: |
          set -euo pipefail
          # The chart does not render bare: it refuses to guess the
          # estate facts it needs (values.schema.json), so every render
          # below starts from tests/ci/<chart>.yaml. The golden
          # renders and the refused fixtures are `just golden`, in the
          # recipes job.
          for c in charts/*; do
            helm lint "$c" -f "tests/ci/$(basename "$c").yaml"
          done
          helm template test charts/ci-builders -f tests/ci/ci-builders.yaml > /dev/null
          # bazel-remote's S3 backend is plumbed but defaults off: the
          # bare render must carry no trace of it, or "default off"
          # is only true until someone forgets to gate a line.
          if helm template test charts/ci-builders -f tests/ci/ci-builders.yaml \
               | grep -qE -- '--s3\.|serviceAccountName'; then
            echo "bare render leaked an S3 flag or serviceAccountName" >&2
            exit 1
          fi
          # bazel-remote S3: flipped on, the flags must actually carry
          # the values given, not just appear as booleans.
          bazel_s3_out=$(helm template test charts/ci-builders -f tests/ci/ci-builders.yaml \
            --set bazelRemote.s3.enabled=true \
            --set bazelRemote.s3.bucket=example-bucket \
            --set bazelRemote.s3.region=us-east-1 \
            --set bazelRemote.serviceAccountName=bazel-remote)
          for flag in \
            '--s3.bucket=example-bucket' \
            '--s3.region=us-east-1' \
            '--s3.auth_method=iam_role' \
            'serviceAccountName: bazel-remote'; do
            if ! grep -qF -- "$flag" <<< "$bazel_s3_out"; then
              echo "bazelRemote.s3.enabled render is missing: $flag" >&2
              exit 1
            fi
          done
          # No endpoint VALUE exists, and none may creep back: this chart
          # authenticates with iam_role only, so an S3-compatible store
          # it could address is one it could never authenticate to --
          # a pod that starts, answers, and caches nothing. bazel-remote
          # does need an endpoint flag to start: the regional AWS one,
          # derived from the region and nothing else.
          out=$(helm template test charts/ci-builders -f tests/ci/ci-builders.yaml \
               --set bazelRemote.s3.enabled=true \
               --set bazelRemote.s3.bucket=example-bucket \
               --set bazelRemote.s3.region=us-east-1 \
               --set bazelRemote.s3.endpoint=https://example.invalid)
          if echo "$out" | grep -q 'example.invalid'; then
            echo "bazelRemote.s3.endpoint is honoured; iam_role cannot authenticate there" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q -- '--s3.endpoint=s3.us-east-1.amazonaws.com'; then
            echo "bazelRemote.s3 does not render the regional AWS endpoint bazel-remote needs to start" >&2
            exit 1
          fi
          # And the render-time refusal: enabling S3 without a bucket
          # (or a region) must fail, the same idiom as the removed-values
          # guard above.
          if helm template test charts/ci-builders -f tests/ci/ci-builders.yaml \
               --set bazelRemote.s3.enabled=true > /dev/null 2>&1; then
            echo "bazelRemote.s3 guard did not fire on a missing bucket/region" >&2
            exit 1
          fi
          if helm template test charts/ci-builders -f tests/ci/ci-builders.yaml \
               --set bazelRemote.s3.enabled=true \
               --set bazelRemote.s3.bucket=example-bucket > /dev/null 2>&1; then
            echo "bazelRemote.s3 guard did not fire on a missing region" >&2
            exit 1
          fi
          echo "charts OK"

      # Two guards on the image pipeline, both asserting a property that
      # is invisible in a green run.
      #
      # The release image must ASSEMBLE and never EXECUTE. One `RUN`
      # added to image/release/ puts the arm64 half of every release
      # under QEMU: correct, green, and minutes slower.
      - name: release images assemble only
        run: ./hack/final-images-are-assembly.sh

      # The version pins in the Dockerfiles are found by PATH, and the
      # split above is exactly what breaks a path. Renovate answers a
      # config that matches nothing by opening no pull requests, which
      # reads as "everything is current" — so this is the only place a
      # stale managerFilePatterns can surface.
      - name: renovate sees every Dockerfile pin
        run: ./hack/renovate-covers-dockerfiles.sh

      # The stamper is load-bearing until the charts adopt helmctl's
      # `images:` convention. A dry run on a scratch copy asserts it still
      # finds every key it is asked for.
      - name: digest stamper finds every key
        run: |
          set -euo pipefail
          cp charts/ci-builders/values.yaml /tmp/ci-builders.bak
          ./hack/stamp-digests.sh \
            cacheRedirectImage=sha256:4444444444444444444444444444444444444444444444444444444444444444
          if ./hack/stamp-digests.sh noSuchImage=sha256:3333333333333333333333333333333333333333333333333333333333333333 2>/dev/null; then
            echo "::error::the stamper accepted a key no chart declares"; exit 1
          fi
          cp /tmp/ci-builders.bak charts/ci-builders/values.yaml
          git diff --exit-code -- charts/ || { echo "::error::the dry run left the charts modified"; exit 1; }

  # Every Go module: cache-redirect (its own image, ci-builders
  # `cacheRedirect`) and the root module (pkg/buildkit, the builders on
  # their own machines).
  go:
    strategy:
      fail-fast: false
      matrix:
        module: [image/cache-redirect, .]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      # One .golangci.yaml at the repo root covers every module under
      # image/: golangci-lint runs once per module, in this matrix, and
      # each run points `--config` back at the single shared file.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yaml
      - name: Vet and test
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (amd64, no push)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --file image/cache-redirect/Dockerfile image/
          # The release image assembles from a base that does not exist
          # until a release runs, so it is LINTED rather than built: what
          # matters about it is that it executes nothing, and that is what
          # the guard in the charts job asserts.
          for f in image/release/*.Dockerfile; do
            docker buildx build --check --file "$f" \
              --build-arg BASE_IMAGE=alpine --build-arg BASE_TAG=3.21 image/ || true
          done

  # The same base on a native arm64 runner, no push.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (arm64, no push)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 \
            --file image/cache-redirect/Dockerfile image/

  # The Justfile's gate, each recipe its own job through the shared check
  # workflow: chart lint and shellcheck, the golden renders and refused
  # fixtures, their Kubernetes schema check, and the leak canary. `vuln`
  # is not here: it runs from security.yaml, which is not a required
  # context, so an advisory published overnight cannot turn every pull
  # request red.
  recipes:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@690acf2363bb57e0af99d62bfe88c894a8f68f0a # v5.9.0
    with:
      recipes: '["lint", "golden", "schema", "leak-canary"]'
      policy-conformance: true
      # A gate since the first release (v0.1.0, whose `## vX.Y.Z` CHANGELOG
      # heading C5 wants).
      policy-conformance-strict: true

  # Stable name for branch protection: the matrix reports as
  # "recipes / lint" and so on, so a required context called "check"
  # would never arrive and every PR would hang waiting for it.
  check:
    needs: [charts, go, image, image-arm64, recipes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.charts.result }}" = "success" ] && [ "${{ needs.go.result }}" = "success" ] && [ "${{ needs.image.result }}" = "success" ] && [ "${{ needs.image-arm64.result }}" = "success" ] && [ "${{ needs.recipes.result }}" = "success" ]'
