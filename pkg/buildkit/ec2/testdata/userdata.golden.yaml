  - - bash
    - -ec
    - |
      # buildkit install
      set -euo pipefail
      if ! id buildkit >/dev/null 2>&1; then
        useradd -K SUB_UID_COUNT=0 -K SUB_GID_COUNT=0 --system --create-home --home-dir /var/lib/buildkit-home --shell /sbin/nologin buildkit
      fi
      grep -q '^buildkit:' /etc/subuid || echo 'buildkit:300000:65536' >>/etc/subuid
      grep -q '^buildkit:' /etc/subgid || echo 'buildkit:300000:65536' >>/etc/subgid
      tar -xzf /usr/local/src/buildkit.tar.gz -C /usr/local bin
      tar -xzf /usr/local/src/rootlesskit.tar.gz -C /usr/local/bin rootlesskit rootlessctl
      rm -f /usr/local/src/buildkit.tar.gz /usr/local/src/rootlesskit.tar.gz
      sysctl --system >/dev/null

      # The cache volume: the launch template's /dev/sdf, which a Nitro instance shows
      # as an NVMe device behind a udev link.
      dev=""
      for _ in $(seq 1 90); do
        for c in /dev/sdf /dev/xvdf; do
          if [ -b "$c" ]; then dev="$(readlink -f "$c")"; break 2; fi
        done
        sleep 2
      done
      [ -n "$dev" ] || { echo "buildkit: no cache volume at /dev/sdf" >&2; exit 1; }
      blkid "$dev" >/dev/null 2>&1 || mkfs.xfs -q -L buildkit-cache "$dev"
      install -d -m 0700 /var/lib/buildkit
      grep -q 'LABEL=buildkit-cache ' /etc/fstab || echo 'LABEL=buildkit-cache /var/lib/buildkit xfs defaults,noatime,nofail 0 2' >>/etc/fstab
      mountpoint -q /var/lib/buildkit || mount /var/lib/buildkit
      chown buildkit:buildkit /var/lib/buildkit
      chmod 0700 /var/lib/buildkit
